<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="felt" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="cloud"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="1" seed="37" result="grain"/>
    <feBlend in="cloud" in2="grain" mode="soft-light"/>
    <feColorMatrix values="0 0 0 0 0.38  0 0 0 0 0.31  0 0 0 0 0.27  0 0 0 .07 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#felt)" opacity=".72"/>
</svg>
