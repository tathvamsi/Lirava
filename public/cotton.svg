<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="cotton" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="17" result="cloud"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="1" seed="29" result="grain"/>
    <feBlend in="cloud" in2="grain" mode="multiply"/>
    <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.39  0 0 0 0 0.33  0 0 0 .055 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#cotton)" opacity=".65"/>
</svg>
